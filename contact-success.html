<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Message Sent – LMHI Canada Chapter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .success-container {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: var(--shadow-soft);
    }

    .success-container i {
      font-size: 4rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .success-container h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .success-container p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .success-btn {
      display: inline-block;
      padding: 10px 22px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: var(--transition);
    }

    .success-btn:hover {
      background: var(--primary-dark);
    }

    .redirect-note {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>

  <script>
    setTimeout(function() {
      window.location.href = "contact.html";
    }, 5000);
  </script>
</head>

<body>

  <div class="success-container">
    <i class="fa-solid fa-circle-check"></i>

    <h1>Message Sent Successfully</h1>

    <p>Thank you for reaching out to the LMHI Canada Chapter.  
       We will get back to you as soon as possible.</p>

    <a href="contact.html" class="success-btn">Return to Contact Page</a>

    <p class="redirect-note">You will be redirected automatically in 5 seconds.</p>
  </div>

</body>
</html>
